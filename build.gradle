// LiteLights is one mod in one jar, built from modules (docs/ARCHITECTURE.md, "Modules"):
//   api         the internal API: interfaces and plain data, no behaviour
//   core        everything that isn't a module yet; implements api and builds the jar
//   farterrain  far terrain; compiles against api only
//   clouds      the new clouds' field, mesher and weather pace: plain Java, no game classes
// core merges them into build/libs/litelights-<version>.jar, with the one mod id litelights.
plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
}

// Almanac's builds, one folder per version (Builds/Minecraft/Almanac/Main Plugin/<version>/almanac-<version>.jar):
// -Palmanac.builds=DIR, or the first such folder above the project, or null.
def findAlmanacBuilds() {
    def configured = findProperty('almanac.builds')
    if (configured) {
        return file(configured)
    }
    for (def dir = rootDir.parentFile; dir != null; dir = dir.parentFile) {
        def builds = new File(dir, 'Builds/Minecraft/Almanac/Main Plugin')
        if (builds.isDirectory()) {
            return builds
        }
    }
    return null
}

// The game-side subprojects. :clouds is plain Java and is set up on its own below, so the build
// keeps the game's classes out of it.
configure(subprojects.findAll { it.name != 'clouds' }) {
    apply plugin: 'net.fabricmc.fabric-loom'

    version = rootProject.property('mod_version')
    group = 'com.thenathe'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://api.modrinth.com/maven' }
        // Almanac is on no Maven. Its jar comes from the workspace's Builds folder when there is one
        // (an Almanac built but not yet released), else straight from its GitHub release.
        def almanacBuilds = findAlmanacBuilds()
        if (almanacBuilds != null) {
            ivy {
                name = 'almanacBuilds'
                url = almanacBuilds.toURI()
                patternLayout { artifact '[revision]/[module]-[revision].[ext]' }
                metadataSources { artifact() }
                content { includeModule('com.thenathe', 'almanac') }
            }
        }
        ivy {
            url = 'https://github.com/THENATHE/almanac/releases/download/'
            patternLayout { artifact 'v[revision]/[module]-[revision].[ext]' }
            metadataSources { artifact() }
            content { includeModule('com.thenathe', 'almanac') }
        }
    }

    dependencies {
        minecraft 'com.mojang:minecraft:26.3'
        // Compiled against the oldest Loader and Fabric API that fabric.mod.json accepts (0.19.3 is the
        // oldest Loader that Fabric API for 26.3 runs on; 0.160.5 is the first Fabric API for the 26.3
        // release), so nothing newer can be used by mistake. QA runs with newer copies (docs/DEPENDENCIES.md).
        implementation 'net.fabricmc:fabric-loader:0.19.3'
        implementation 'net.fabricmc.fabric-api:fabric-api:0.160.5+26.3'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}

project(':clouds') {
    apply plugin: 'java-library'

    version = rootProject.property('mod_version')
    group = 'com.thenathe'

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}
