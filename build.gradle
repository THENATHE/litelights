plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }

version = project.mod_version
group = 'com.thenathe'
base { archivesName = 'litelights' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.166.0+26.3'
    // Optional at runtime: Mod Menu's config button only appears when it is installed.
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
    // Optional at runtime: Sodium's public config API, for LiteLights' pages in Sodium's Video Settings.
    // The API is the same in 0.9.2 (bAZQdGpg) and 0.9.3-beta.5 (v7Lw0h1m); compiled against the stable one.
    compileOnly 'maven.modrinth:sodium:bAZQdGpg'
    // Continuity's public API (CtmLoaderRegistry and friends), for the overlays module's own drawing
    // method. Pinned to the Modrinth version id of 3.0.1+26.3; the module checks the API at runtime
    // and falls back to plain overlay files if it changes.
    compileOnly 'maven.modrinth:continuity:Jt2sCWTQ'
    // Optional at runtime: Distant Horizons' public API (com.seibel.distanthorizons.api only), for
    // LiteLights' haze, light and shadows on its far terrain. Pinned to 3.3.4-26.3 (TGgEbP9A, API
    // 7.2.0); the hook is only loaded when Distant Horizons is installed and turns itself off with
    // a reason on the Far terrain row if the API has changed.
    compileOnly 'maven.modrinth:distanthorizons:TGgEbP9A'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    // Overlay style previews (StylePreview in src/test) are drawn only when asked for.
    systemProperty 'litelights.overlays.preview.textures', findProperty('litelights.overlays.preview.textures') ?: ''
    systemProperty 'litelights.overlays.preview.bricks', findProperty('litelights.overlays.preview.bricks') ?: ''
    // The wakes' offline prototype (WakePreview in src/test) draws its frames only when asked for.
    systemProperty 'litelights.wakes.preview', findProperty('litelights.wakes.preview') ?: ''
    // Where a generation's time and memory go (GenerationCostProbe), only when asked for.
    systemProperty 'litelights.overlays.probe', findProperty('litelights.overlays.probe') ?: 'false'
    testLogging { showStandardStreams = findProperty('litelights.overlays.probe') == 'true' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

jar {
    // The credits and licences travel with the mod.
    from('CREDITS.md') { into 'META-INF' }
    from('LICENSE') { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
